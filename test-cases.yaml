grouped:
  name: Grouped
  description: >-
    Mocked IO — exercises the Group Data card: a value grouper (patrol serial
    number, hits the traj rename + int->string cast) plus a monthly temporal
    grouper (hits add_temporal_index).
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Track Density Map"
      description: "Gridded density map of patrol tracks."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_patrol_params:
      patrol_types: ["demo_patrol"]
    groupers:
      groupers:
        - index_name: "patrol_serial_number"
        - temporal_index: "%B"
    density_weighting:
      density_sum_column: timespan_seconds
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1.0

advanced-config:
  name: Advanced Config
  description: >-
    Mocked IO — exercises the density-map Advanced Configurations (custom grid
    cell size + non-default CRS + heatmap opacity). Complements Base, which
    leaves all of these default.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Track Density Map"
      description: "Gridded density map of patrol tracks."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_patrol_params:
      patrol_types: ["demo_patrol"]
    groupers:
      groupers: []
    density_weighting:
      density_sum_column: dist_meters
    density_grid_options:              # the Advanced Configurations accordion
      opacity: 0.5
      auto_scale_or_custom_cell_size:
        auto_scale_or_custom: "Customize"
        grid_cell_size: 2500
      crs: "EPSG:3395"
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1.0

mep_dev:
  name: MEP Dev
  description: >-
    Live EarthRanger (mep-dev), 10 Jan - 28 Feb 2015 seeded ecoscope_patrol data
    (same window/type as patrol-efforts' live case).
  mock_io: false
  params:
    workflow_details:
      name: "Patrol Track Density Map"
      description: "Gridded density map of patrol tracks."
    er_client_name:
      data_source:
        name: "mep_dev"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "Africa/Nairobi (UTC+03:00)"
        tzCode: "Africa/Nairobi"
        name: "(UTC+03:00) Nairobi"
        utc: "+03:00"
    er_patrol_params:
      patrol_types: ["ecoscope_patrol"]
      status: ["done"]
    groupers:
      groupers: []
    density_weighting:
      density_sum_column: timespan_seconds
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1.0
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
          opacity: 0.5

